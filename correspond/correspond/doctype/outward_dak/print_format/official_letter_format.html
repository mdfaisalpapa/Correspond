<div class="print-format">
    <!-- Optional: Pulls Frappe's Letter Head header -->
    {% if letter_head %}
        <div class="letter-head">
            {{ letter_head }}
        </div>
    {% endif %}

    <div class="print-heading">
        <h2>Outward Dak</h2>
        <small class="text-muted">{{ doc.name }}</small>
    </div>

    <div class="row section-break">
        <div class="col-xs-6">
            <strong>No:</strong> {{ doc.name }}<br>
            <strong>File Ref:</strong> {{ doc.primary_file or '' }}
        </div>
        <div class="col-xs-6 text-right">
            <strong>Date:</strong> {{ frappe.utils.formatdate(doc.creation) }}
        </div>
    </div>

    <hr>

    <div class="row section-break">
        <div class="col-xs-12">
            <h4>Subject: {{ doc.subject }}</h4>
        </div>
    </div>

    <div class="row section-break" style="margin-top: 20px;">
        <div class="col-xs-12 value">
            {{ doc.letter_body }}
        </div>
    </div>

    <div class="row section-break" style="margin-top: 40px;">
        <div class="col-xs-12 text-right">
            <p><strong>Regards,</strong></p>
            <p>{{ doc.signature or frappe.session.user }}</p>
        </div>
    </div>
</div>
